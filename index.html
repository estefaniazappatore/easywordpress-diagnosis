<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EasyWordPress — Diagnosi del problema</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <div class="chat-window">

            <!-- HEADER -->
            <header class="chat-header">

                <div class="logo">🔧</div>

                <div class="brand">
                    <h1>EasyWordPress</h1>
                    <p>Diagnosi del problema</p>
                </div>

                <div class="status">
                    <span></span>
                    Online
                </div>

            </header>


            <!-- PROGRESS -->
            <div class="progress-container">

                <div class="progress-info">

                    <span id="progress-text">
                        Analisi del problema
                    </span>

                    <span id="progress-count"></span>

                </div>

                <div class="progress-track">
                    <div id="progress-bar"></div>
                </div>

            </div>


            <!-- CHAT -->
            <div id="chat" class="chat"></div>


            <!-- TYPING -->
            <div id="typing" class="typing hidden">

                <span></span>
                <span></span>
                <span></span>

            </div>


            <!-- OPTIONS -->
            <div id="options" class="options"></div>


            <!-- RESULT -->
            <div id="result" class="result hidden"></div>


            <!-- CONTACT FORM -->
            <div id="contact-form" class="contact-form hidden">

                <div class="form-intro">

                    <div class="form-icon">
                        ✉️
                    </div>

                    <div>

                        <h2>
                            Procediamo?
                        </h2>

                        <p>
                            Inserisci i tuoi dati per ricevere
                            il riepilogo e procedere con la richiesta.
                        </p>

                    </div>

                </div>


                <label for="name">
                    Nome
                </label>

                <input
                    id="name"
                    type="text"
                    placeholder="Il tuo nome"
                    autocomplete="name"
                >


                <label for="email">
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="nome@email.it"
                    autocomplete="email"
                >


                <label for="website">
                    Sito web
                </label>

                <input
                    id="website"
                    type="url"
                    placeholder="https://iltuosito.it"
                    autocomplete="url"
                >


                <button
                    id="submit-contact"
                    type="button"
                >
                    Continua →
                </button>


                <small>
                    I dati saranno utilizzati per gestire la tua richiesta.
                </small>

            </div>

        </div>

    </main>


    <!--
        ORDINE IMPORTANTE:

        1. questions.js
        2. results.js
        3. script.js

        script.js usa questions e results,
        quindi devono essere caricati prima.
    -->

    <script src="questions.js"></script>
    <script src="results.js"></script>
    <script src="script.js"></script>

</body>

</html>
