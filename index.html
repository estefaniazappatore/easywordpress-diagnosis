<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EasyWordPress — Diagnosi del problema</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <div class="chat-window">

            <header class="chat-header">

                <div class="logo">🔧</div>

                <div class="brand">
                    <h1>EasyWordPress</h1>
                    <p>Diagnosi del problema</p>
                </div>

                <div class="status">
                    <span></span>
                    Online
                </div>

            </header>


            <div class="progress-area">

                <div class="progress-label">
                    <span id="progress-text">Analisi del problema</span>
                    <span id="progress-count"></span>
                </div>

                <div class="progress-track">
                    <div id="progress-bar"></div>
                </div>

            </div>


            <div id="chat" class="chat"></div>


            <div id="typing" class="typing hidden">
                <span></span>
                <span></span>
                <span></span>
            </div>


            <div id="options" class="options"></div>


            <div id="result" class="result hidden"></div>


            <div id="contact-form" class="contact-form hidden">

                <div class="form-intro">

                    <div class="form-icon">✉️</div>

                    <div>
                        <h2>Procediamo?</h2>

                        <p>
                            Inserisci i tuoi dati per ricevere
                            il riepilogo e procedere con la richiesta.
                        </p>
                    </div>

                </div>


                <label for="name">Nome</label>

                <input
                    id="name"
                    type="text"
                    placeholder="Il tuo nome"
                >


                <label for="email">Email</label>

                <input
                    id="email"
                    type="email"
                    placeholder="nome@email.it"
                >


                <label for="website">Sito web</label>

                <input
                    id="website"
                    type="url"
                    placeholder="https://iltuosito.it"
                >


                <button id="submit-contact">
                    Continua →
                </button>


                <small>
                    I dati saranno utilizzati per gestire la tua richiesta.
                </small>

            </div>


            <!-- =========================================
                 RESTART
            ========================================== -->

            <div id="restart-container" class="restart-container hidden">

                <button
                    id="restart-button"
                    class="restart-button"
                    type="button"
                >
                    ↻ Ricomincia la diagnosi
                </button>

            </div>

        </div>

    </main>


    <script src="questions.js"></script>
    <script src="results.js"></script>
    <script src="script.js"></script>

</body>

</html>
